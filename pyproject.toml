[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhidu-intel"
version = "0.1.0"
description = "知盾 AI 安全情报系统：多源采集、结构化富化与可追溯审计检索"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "httpx>=0.27,<1", "pydantic-settings>=2.5,<3", "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4", "packaging>=24,<27",
]

[project.optional-dependencies]
semantic = ["fastembed==0.7.4"]
agent = ["langchain==1.4.4", "langgraph==1.2.14", "langchain-deepseek==1.1.1", "langchain-openai==1.7.0", "langgraph-checkpoint-sqlite==3.1.1"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
zhidu = "zhidu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zhidu = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "historic_snapshot: requires optional frozen historical database/raw snapshots; skipped only when required files are absent",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
